owner: saverio-sg
repo: imake-status
user-agent: saverio-sg

sites:
  # La API responde y llega a la base de datos. Se da por caído si el cuerpo no
  # contiene "db":"connected" (aunque el código HTTP sea 200).
  - name: API de imake.im
    url: https://imake.im/api/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"db":"connected"'

  - name: Web de imake.im
    url: https://imake.im/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

status-website:
  name: Estado de imake.im
  # Dominio propio: GitHub Pages sirve en la raíz, así que baseUrl es "/".
  cname: status.imake.im
  baseUrl: /
  navbar:
    - title: Estado
      href: /
    - title: imake.im
      href: https://imake.im

# Notificaciones: no se declaran aquí; se activan con secretos del repositorio
# (https://upptime.js.org/docs/notifications). Los avisos al móvil ya los envía
# la API con ntfy; aquí basta con las incidencias de GitHub.
